# 用于 Oryx 后台、HLS 和播放门户共用一个域名的场景。
# 把以下 location 放进现有 HTTPS server 中。

upstream oryx_live_portal {
    server 10.0.0.20:8086;
    keepalive 16;
}

location = /portal {
    return 301 /portal/;
}

# 必须保留 /portal/ 前缀，不能在 proxy_pass 后添加结尾斜杠。
location ^~ /portal/ {
    proxy_pass http://oryx_live_portal;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# OAuth 回调包含一次性授权码，不写入外层 Nginx 访问日志。
location = /oauth2/callback {
    access_log off;
    proxy_pass http://oryx_live_portal;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# OAuth2 登录、用户信息和退出接口。
location ^~ /oauth2/ {
    proxy_pass http://oryx_live_portal;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

location = /portal-signed-out {
    return 301 /portal-signed-out/;
}

location ^~ /portal-signed-out/ {
    proxy_pass http://oryx_live_portal;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# 原有 /live/ HLS 和 / Oryx 后台 location 保持不变。
